const{useState,useMemo,useEffect}=React;
const C={bg:"#f7f7fb",card:"#fff",border:"#e2e4ed",accent:"#4f46e5",accentLight:"#ede9fe",accentMuted:"#818cf8",text:"#18181b",textMuted:"#6b7280",textDim:"#9ca3af",green:"#10b981",amber:"#f59e0b",red:"#ef4444",orange:"#f97316",blue:"#3b82f6"};
const fmt=v=>"$"+Number(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});

function fmtM(m){if(!m)return"";const s=m.toLowerCase();if(s.includes("opus-4-8"))return"Opus 4.8";if(s.includes("opus-4-7"))return"Opus 4.7";if(s.includes("opus-4-6"))return"Opus 4.6";if(s.includes("opus-4-5"))return"Opus 4.5";if(s.includes("3-opus")||s.includes("opus-3"))return"Claude 3 Opus";if(s.includes("sonnet-4-6"))return"Sonnet 4.6";if(s.includes("sonnet-4-5"))return"Sonnet 4.5";if(s.includes("sonnet-4-2")||s.includes("sonnet-4-20"))return"Sonnet 4 (legacy)";if(s.includes("haiku-4-5"))return"Haiku 4.5";return m;}
function mColor(m){if(!m)return C.textDim;const s=m.toLowerCase();if(s.includes("opus"))return C.red;if(s.includes("sonnet"))return C.accent;if(s.includes("haiku"))return C.green;return C.textDim;}

function DeltaBadge({val,suffix,invert}){
  suffix=suffix||"%";invert=invert||false;
  if(val===null||val===undefined)return null;
  const isGood=invert?val<0:val>0;
  const isNeutral=val===0;
  const color=isNeutral?C.textDim:isGood?C.green:C.red;
  const bg=isNeutral?"#f3f4f6":isGood?"#f0fdf4":"#fef2f2";
  const sign=val>0?"+":"";
  return React.createElement("span",{style:{background:bg,color,fontSize:11,fontWeight:700,padding:"2px 7px",borderRadius:99,whiteSpace:"nowrap"}},sign+val+suffix);
}

function FlagPill({flag}){
  const cols={"max-plan":{bg:"#fef2f2",tx:"#dc2626",lb:"Max Plan"},"approaching":{bg:"#fff7ed",tx:"#c2410c",lb:"Approaching"},"cowork-opus":{bg:"#fdf4ff",tx:"#7e22ce",lb:"Cowork\u2192Opus"},"opus-heavy":{bg:"#fef3c7",tx:"#92400e",lb:"Opus Heavy"},"legacy":{bg:"#f0fdf4",tx:"#166534",lb:"Legacy"},"low-engagement":{bg:"#f0f9ff",tx:"#0369a1",lb:"Low Usage"}};
  const c=cols[flag]||{bg:C.accentLight,tx:C.accent,lb:flag};
  return React.createElement("span",{style:{background:c.bg,color:c.tx,fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:99,letterSpacing:"0.04em",textTransform:"uppercase",whiteSpace:"nowrap",margin:"1px 2px"}},c.lb);
}

function MBar({modelMix}){
  if(!modelMix)return null;
  const tot=Object.values(modelMix).reduce((s,v)=>s+v.spend,0)||1;
  return React.createElement("div",{style:{display:"flex",height:6,borderRadius:3,overflow:"hidden",width:80,gap:1}},
    Object.entries(modelMix).sort((a,b)=>b[1].spend-a[1].spend).map(([m,v])=>
      React.createElement("div",{key:m,style:{width:`${v.spend/tot*100}%`,background:mColor(m),minWidth:v.spend>0?1:0},title:fmtM(m)+": "+fmt(v.spend)})));
}

function SparkLine({values,color,height,width}){
  height=height||28;width=width||120;
  if(!values||values.length<2)return null;
  const max=Math.max(...values);
  const min=Math.min(...values);
  const range=max-min||1;
  const pad=3;
  const iH=height-pad*2;
  const iW=width-pad*2;
  const pts=values.map((v,i)=>pad+(i/(values.length-1))*iW+","+(pad+iH-((v-min)/range)*iH)).join(" ");
  const lx=pad+iW;
  const ly=pad+iH-((values[values.length-1]-min)/range)*iH;
  return React.createElement("svg",{viewBox:"0 0 "+width+" "+height,style:{width,height}},
    React.createElement("polyline",{points:pts,fill:"none",stroke:color,strokeWidth:"1.5",strokeLinejoin:"round"}),
    React.createElement("circle",{cx:lx,cy:ly,r:"2",fill:color}));
}

function ExpandRow({user}){

        React.createElement("span",{style:{color:mColor(m)}},fmtM(m)),

    React.createElement("div",null,

        React.createElement("thead",null,
          React.createElement("tr",null,
            React.createElement("th",{style:{textAlign:"left",padding:"2px 8px 2px 0",color:C.textDim,fontWeight:600}},"Product"),
            allM.map(m=>React.createElement("th",{key:m,style:{textAlign:"right",padding:"2px 4px",color:mColor(m),fontWeight:600}},fmtM(m))),
            React.createElement("th",{style:{textAlign:"right",padding:"2px 0 2px 4px",color:C.textDim,fontWeight:600}},"Total"))),
        React.createElement("tbody",null,
          allP.map((p,i)=>{
            const rT=allM.reduce((s,m)=>s+(mx[p]&&mx[p][m]?mx[p][m].spend:0),0);
            return React.createElement("tr",{key:p,style:{background:i%2===0?"transparent":"#f0f0f5"}},
              React.createElement("td",{style:{padding:"2px 8px 2px 0",color:C.textMuted}},p),
              allM.map(m=>React.createElement("td",{key:m,style:{textAlign:"right",padding:"2px 4px",color:mx[p]&&mx[p][m]&&mx[p][m].spend>0?C.text:C.textDim}},mx[p]&&mx[p][m]&&mx[p][m].spend>0?fmt(mx[p][m].spend):"—")),
              React.createElement("td",{style:{textAlign:"right",padding:"2px 0 2px 4px",fontWeight:700,color:C.text}},fmt(rT)));
          }),

            React.createElement("td",{style:{padding:"4px 8px 2px 0",fontWeight:700}},"Total"),
            allM.map(m=>{

function App(){

      {label:"Low Engagement",count:(DATA.lowEngagement||[]).length,color:C.blue,desc:"<$10/mo",mk:"lowEngagement"}

    return React.createElement("div",{style:{padding:24}},
      React.createElement("div",{style:{display:"flex",gap:12,flexWrap:"wrap",marginBottom:24}},
        React.createElement(StatCard,{label:"Total Spend",value:fmt(s.totalSpend),sub:s.activeUsers+" active users",accent:C.accent,delta:mom&&mom.spend&&mom.spend.deltaPct}),
        React.createElement(StatCard,{label:"Avg / User",value:fmt(s.avgSpend),sub:"per month",delta:mom&&mom.avgSpend&&mom.avgSpend.deltaPct}),
        React.createElement(StatCard,{label:"Total Requests",value:s.totalRequests.toLocaleString(),sub:(s.totalPromptTokens/1e9).toFixed(1)+"B prompt tokens"}),
        React.createElement(StatCard,{label:"Top 10 Users",value:fmt(s.top10Spend),sub:s.top10Pct+"% of total"})),

        React.createElement("div",{style:{fontSize:12,fontWeight:700,color:C.textDim,textTransform:"uppercase",letterSpacing:"0.06em"}},"vs April 2026"),
